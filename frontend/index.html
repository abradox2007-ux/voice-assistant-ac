<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AC — Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & base ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0c10;
    --surface:   #13141a;
    --border:    #1e2030;
    --text:      #e8eaf0;
    --muted:     #5a5f7a;
    --accent:    #6c8dfa;
    --accent2:   #a78bfa;
    --green:     #4ade80;
    --red:       #f87171;
    --yellow:    #facc15;

    --phase-idle:       var(--muted);
    --phase-waiting:    var(--yellow);
    --phase-listening:  var(--accent);
    --phase-processing: var(--accent2);
    --phase-error:      var(--red);

    --font-display: 'Space Grotesk', sans-serif;
    --font-mono:    'Space Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  .app {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── Header ───────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo-mark {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: grid; place-items: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: -1px;
    color: #fff;
    flex-shrink: 0;
  }

  .brand { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; }
  .brand span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }

  .conn-dot {
    margin-left: auto;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s;
  }
  .conn-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* ── Main content ─────────────────────────────────────────── */
  main {
    padding: 36px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  /* ── Orb ──────────────────────────────────────────────────── */
  .orb-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .orb-wrap {
    position: relative;
    width: 140px; height: 140px;
  }

  /* Wave ripples radiating from behind the microphone orb */
  .orb-wrap::before,
  .orb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--phase-color, var(--accent));
    opacity: 0;
    z-index: -1;
    transition: transform 0.4s, opacity 0.4s, background 0.4s;
    pointer-events: none;
  }

  /* Listening state: smooth continuous waves */
  .orb-wrap.listening::before {
    animation: ripple 2.2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
  }
  .orb-wrap.listening::after {
    animation: ripple 2.2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    animation-delay: 1.1s;
  }

  /* Processing state: faster, dynamic pulses */
  .orb-wrap.processing::before {
    animation: ripple 1.2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
  }
  .orb-wrap.processing::after {
    animation: ripple 1.2s cubic-bezier(0.25, 0.8, 0.25, 1) infinite;
    animation-delay: 0.6s;
  }

  @keyframes ripple {
    0% {
      transform: scale(1);
      opacity: 0.6;
    }
    100% {
      transform: scale(1.7);
      opacity: 0;
    }
  }

  /* Outer ring pulse — only during listening */
  .orb-ring {
    position: absolute; inset: -16px;
    border-radius: 50%;
    border: 2px solid transparent;
    transition: border-color 0.4s;
  }
  .orb-ring.active {
    border-color: color-mix(in srgb, var(--phase-color, var(--accent)) 40%, transparent);
    animation: ringPulse 1.6s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%       { transform: scale(1.1); opacity: 0.4; }
  }

  .orb {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(
      circle at 38% 36%,
      color-mix(in srgb, var(--phase-color, var(--muted)) 60%, #fff 40%),
      color-mix(in srgb, var(--phase-color, var(--muted)) 90%, var(--bg)) 70%,
      var(--bg)
    );
    transition: --phase-color 0.5s, background 0.5s;
    box-shadow:
      0 0 40px color-mix(in srgb, var(--phase-color, var(--muted)) 25%, transparent),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Mic icon inside orb */
  .orb-icon {
    position: absolute; inset: 0;
    display: grid; place-items: center;
  }
  .orb-icon svg { width: 36px; height: 36px; color: rgba(255,255,255,0.85); }

  /* Soundwave bars — appear only when listening */
  .waves {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 28px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .waves.active { opacity: 1; }
  .waves span {
    width: 4px;
    border-radius: 2px;
    background: var(--phase-color, var(--accent));
    animation: wave 0.9s ease-in-out infinite;
  }
  .waves span:nth-child(1) { animation-delay: 0s;    height: 40%; }
  .waves span:nth-child(2) { animation-delay: 0.12s; height: 70%; }
  .waves span:nth-child(3) { animation-delay: 0.24s; height: 100%; }
  .waves span:nth-child(4) { animation-delay: 0.12s; height: 70%; }
  .waves span:nth-child(5) { animation-delay: 0s;    height: 40%; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); }
    50%       { transform: scaleY(1); }
  }

  /* ── Transcript box ────────────────────────────────────────── */
  .transcript-box {
    background: rgba(108, 141, 250, 0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    display: none;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 8px;
    transition: all 0.3s ease;
  }
  .transcript-box.active {
    display: flex;
    animation: fadeIn 0.4s ease;
  }
  .transcript-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent);
  }
  .transcript-text {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Status card ──────────────────────────────────────────── */
  .status-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 24px;
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .phase-badge {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 6px;
    background: color-mix(in srgb, var(--phase-color, var(--muted)) 15%, transparent);
    color: var(--phase-color, var(--muted));
    border: 1px solid color-mix(in srgb, var(--phase-color, var(--muted)) 30%, transparent);
    flex-shrink: 0;
    transition: all 0.4s;
  }

  .status-msg {
    font-size: 15px;
    color: var(--text);
    flex: 1;
    line-height: 1.4;
  }

  /* ── Timeout bar ──────────────────────────────────────────── */
  .timeout-wrap {
    margin-top: 14px;
    display: none;
  }
  .timeout-wrap.active { display: block; }

  .timeout-label {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
  }
  .timeout-label span { color: var(--accent); }

  .timeout-track {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .timeout-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.5s linear, background 0.4s;
    width: 100%;
  }
  .timeout-fill.urgent { background: linear-gradient(90deg, var(--yellow), var(--red)); }

  /* ── History ──────────────────────────────────────────────── */
  .section-label {
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: start;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hist-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 13px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .hist-icon.ok    { background: color-mix(in srgb, var(--green) 15%, transparent); color: var(--green); }
  .hist-icon.fail  { background: color-mix(in srgb, var(--red)   15%, transparent); color: var(--red);   }

  .hist-body { min-width: 0; }
  .hist-cmd {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hist-resp {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hist-time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 32px 0;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .empty-state .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* ── Footer ───────────────────────────────────────────────── */
  footer {
    padding: 20px 0;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  .footer-commands {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .cmd-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Responsive ───────────────────────────────────────────── */
  @media (max-width: 600px) {
    .app { padding: 0 16px; }
    .footer-commands { display: none; }
  }

  /* ── Diary Manual Modal ────────────────────────────────────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(11, 12, 16, 0.85);
    backdrop-filter: blur(12px);
    display: grid; place-items: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 1000;
  }
  .modal-overlay.active {
    opacity: 1; pointer-events: auto;
  }

  .modal-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 90%; max-width: 600px;
    max-height: 85vh;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
    transform: translateY(20px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal-overlay.active .modal-card {
    transform: translateY(0);
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 18px; font-weight: 600; }
  .modal-close {
    background: transparent; border: none; color: var(--muted);
    font-size: 24px; cursor: pointer; transition: color 0.2s;
  }
  .modal-close:hover { color: var(--text); }

  .modal-body {
    padding: 24px; overflow-y: auto; flex: 1;
    display: flex; flex-direction: column; gap: 20px;
  }

  .btn-group { display: flex; gap: 12px; }
  .btn-panel {
    flex: 1; padding: 14px; border-radius: 12px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    color: var(--text); font-family: var(--font-display);
    font-weight: 500; font-size: 14px;
    cursor: pointer; transition: all 0.3s;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .btn-panel:hover {
    border-color: var(--accent);
    background: rgba(108, 141, 250, 0.05);
    transform: translateY(-2px);
  }
  .btn-panel svg { width: 24px; height: 24px; color: var(--accent); }
  .btn-panel.active {
    border-color: var(--accent);
    background: rgba(108, 141, 250, 0.1);
  }

  .panel-section { display: none; flex-direction: column; gap: 12px; }
  .panel-section.active { display: flex; }

  .textarea-styled {
    width: 100%; min-height: 120px;
    background: rgba(0,0,0,0.2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px;
    color: var(--text); font-family: inherit; font-size: 14px;
    resize: vertical; outline: none;
    transition: border-color 0.2s;
  }
  .textarea-styled:focus { border-color: var(--accent); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff; padding: 12px 20px;
    border-radius: 8px; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: opacity 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover { opacity: 0.9; }

  .diary-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
  .diary-item {
    background: rgba(255,255,255,0.01);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 12px;
    cursor: pointer; transition: all 0.2s;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .diary-item:hover {
    background: rgba(255,255,255,0.03);
    border-color: var(--muted);
  }
  .diary-item.selected {
    border-color: var(--accent2);
    background: rgba(167, 139, 250, 0.05);
  }
  .diary-meta { font-size: 11px; font-family: var(--font-mono); color: var(--muted); }
  .diary-snippet { font-size: 13px; color: var(--text); margin-top: 4px; line-height: 1.4; }
  
  .btn-delete-item {
    background: transparent; border: none; color: var(--red);
    cursor: pointer; opacity: 0.7; transition: opacity 0.2s;
    padding: 4px;
  }
  .btn-delete-item:hover { opacity: 1; }

  /* ── @property for CSS variable transitions ───────────────── */
  @property --phase-color {
    syntax: '<color>';
    inherits: true;
    initial-value: #5a5f7a;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo-mark">AC</div>
    <div class="brand">Voice Assistant <span>v1.0</span></div>
    <div class="conn-dot" id="connDot"></div>
  </header>

  <main>

    <!-- Orb + waves -->
    <div class="orb-section">
      <div class="orb-wrap" id="orbWrap">
        <div class="orb-ring" id="orbRing"></div>
        <div class="orb" id="orb" style="--phase-color: var(--muted)">
          <div class="orb-icon">
            <!-- mic SVG -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8"  y1="23" x2="16" y2="23"/>
            </svg>
          </div>
        </div>
      </div>

      <div class="waves" id="waves">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <!-- Transcript box (shows what the user said) -->
    <div class="transcript-box" id="transcriptBox">
      <div class="transcript-label">YOU SAID</div>
      <div class="transcript-text" id="transcriptText"></div>
    </div>

    <!-- Status card -->
    <div class="status-card">
      <div class="status-row">
        <div class="phase-badge" id="phaseBadge">OFFLINE</div>
        <div class="status-msg"  id="statusMsg">Waiting for AC to start…</div>
      </div>

      <div class="timeout-wrap" id="timeoutWrap">
        <div class="timeout-label">
          <span>Listening window</span>
          <span id="timeoutSecs">15s</span>
        </div>
        <div class="timeout-track">
          <div class="timeout-fill" id="timeoutFill"></div>
        </div>
      </div>
    </div>

    <!-- Command history -->
    <div>
      <div class="section-label">Command History</div>
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <div class="empty-icon">🎙</div>
          No commands yet — say "Hey AC" to begin
        </div>
      </div>
    </div>

  </main>

  <footer>
    <div>Say "Hey AC" to wake · 15s window</div>
    <div class="footer-commands">
      <span class="cmd-chip">open [site/app]</span>
      <span class="cmd-chip">create file [name]</span>
      <span class="cmd-chip">diary [entry]</span>
      <span class="cmd-chip">read diary</span>
      <span class="cmd-chip">what time is it</span>
      <span class="cmd-chip">what's the weather</span>
    </div>
  </footer>

</div>

<!-- Diary Manual Modal Overlay -->
<div class="modal-overlay" id="diaryModal">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title">📖 Manual Diary Control</h2>
      <button class="modal-close" onclick="closeDiaryModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="btn-group">
        <button class="btn-panel active" id="btnWriteTab" onclick="switchDiaryTab('write')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          Write Entry
        </button>
        <button class="btn-panel" id="btnOverwriteTab" onclick="switchDiaryTab('overwrite')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Modify Entry
        </button>
        <button class="btn-panel" id="btnDeleteTab" onclick="switchDiaryTab('delete')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          Delete Entry
        </button>
      </div>

      <!-- Write Section -->
      <div class="panel-section active" id="secWrite">
        <textarea class="textarea-styled" id="txtWrite" placeholder="Type your diary entry here..."></textarea>
        <div>
          <button class="btn-primary" onclick="submitDiaryWrite()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Entry
          </button>
        </div>
      </div>

      <!-- Overwrite Section -->
      <div class="panel-section" id="secOverwrite">
        <div class="diary-list" id="lstOverwrite"></div>
        <div id="editArea" style="display:none; flex-direction:column; gap:12px; margin-top:8px;">
          <textarea class="textarea-styled" id="txtOverwrite" placeholder="Edit the entry content..."></textarea>
          <div>
            <button class="btn-primary" onclick="submitDiaryOverwrite()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Save Changes
            </button>
          </div>
        </div>
      </div>

      <!-- Delete Section -->
      <div class="panel-section" id="secDelete">
        <div class="diary-list" id="lstDelete"></div>
      </div>

      <div id="modalToast" style="display:none; font-size:13px; padding:10px 14px; border-radius:8px; text-align:center; animation: fadeIn 0.2s;"></div>
    </div>
  </div>
</div>

<script>
/* ── Config ──────────────────────────────────────────────────── */
const POLL_MS = 600;  // how often we ask the server for updates

const PHASE_COLORS = {
  idle:         'var(--muted)',
  waiting:      'var(--yellow)',
  listening:    'var(--accent)',
  processing:   'var(--accent2)',
  error:        'var(--red)',
  diary_manual: 'var(--accent2)',
};

const PHASE_LABELS = {
  idle:         'IDLE',
  waiting:      'WAITING',
  listening:    'LISTENING',
  processing:   'PROCESSING',
  error:        'ERROR',
  diary_manual: 'MANUAL',
};

/* ── State ───────────────────────────────────────────────────── */
let lastPhase     = null;
let lastMsg       = null;
let lastHistLen   = 0;
let listenStart   = null;
let connected     = false;
let timerRAF      = null;

/* ── DOM refs ────────────────────────────────────────────────── */
const orb         = document.getElementById('orb');
const orbWrap     = document.getElementById('orbWrap');
const orbRing     = document.getElementById('orbRing');
const waves       = document.getElementById('waves');
const phaseBadge  = document.getElementById('phaseBadge');
const statusMsg   = document.getElementById('statusMsg');
const transcriptBox = document.getElementById('transcriptBox');
const transcriptText = document.getElementById('transcriptText');
const timeoutWrap = document.getElementById('timeoutWrap');
const timeoutFill = document.getElementById('timeoutFill');
const timeoutSecs = document.getElementById('timeoutSecs');
const historyList = document.getElementById('historyList');
const connDot     = document.getElementById('connDot');

/* ── Apply phase visuals ─────────────────────────────────────── */
function applyPhase(phase, msg) {
  const color = PHASE_COLORS[phase] || PHASE_COLORS.idle;
  const label = PHASE_LABELS[phase] || phase.toUpperCase();

  orb.style.setProperty('--phase-color', color);
  waves.style.setProperty('--phase-color', color);
  timeoutFill.style.setProperty('--phase-color', color);

  phaseBadge.textContent = label;
  phaseBadge.style.setProperty('--phase-color', color);

  statusMsg.textContent = msg;

  const isListening = phase === 'listening';
  waves.classList.toggle('active', isListening);
  orbRing.classList.toggle('active', isListening || phase === 'processing');
  orbWrap.classList.toggle('listening', phase === 'listening');
  orbWrap.classList.toggle('processing', phase === 'processing');

  if (phase === 'processing' && msg.startsWith('Processing: "')) {
    const match = msg.match(/^Processing: "(.*)"$/);
    if (match && match[1]) {
      transcriptText.textContent = match[1];
      transcriptBox.classList.add('active');
    }
  } else if (phase === 'listening' || phase === 'waiting') {
    transcriptBox.classList.remove('active');
    transcriptText.textContent = '';
  }

  const isDiaryManual = phase === 'diary_manual';
  const modal = document.getElementById('diaryModal');
  if (modal) {
    if (isDiaryManual) {
      const wasActive = modal.classList.contains('active');
      modal.classList.add('active');
      if (!wasActive) {
        switchDiaryTab('write');
      }
    }
  }

  // Timeout bar: only show during listening
  if (isListening) {
    if (lastPhase !== 'listening') {
      listenStart = Date.now();
      startTimer();
    }
    timeoutWrap.classList.add('active');
  } else {
    timeoutWrap.classList.remove('active');
    if (timerRAF) { cancelAnimationFrame(timerRAF); timerRAF = null; }
  }

  lastPhase = phase;
  lastMsg   = msg;
}

/* ── Timer bar animation ─────────────────────────────────────── */
function startTimer() {
  const TOTAL = 15000; // 15 s
  if (timerRAF) cancelAnimationFrame(timerRAF);

  function tick() {
    const elapsed = Date.now() - listenStart;
    const frac    = Math.max(0, 1 - elapsed / TOTAL);
    const secsLeft = Math.ceil(frac * 15);

    timeoutFill.style.width = (frac * 100) + '%';
    timeoutSecs.textContent = secsLeft + 's';
    timeoutFill.classList.toggle('urgent', frac < 0.3);

    if (frac > 0) {
      timerRAF = requestAnimationFrame(tick);
    }
  }
  timerRAF = requestAnimationFrame(tick);
}

/* ── Render history ──────────────────────────────────────────── */
function renderHistory(items) {
  if (!items || items.length === 0) return;

  historyList.innerHTML = '';
  items.forEach(item => {
    const el = document.createElement('div');
    el.className = 'history-item';
    el.innerHTML = `
      <div class="hist-icon ${item.ok ? 'ok' : 'fail'}">${item.ok ? '✓' : '✕'}</div>
      <div class="hist-body">
        <div class="hist-cmd">${escHtml(item.command)}</div>
        <div class="hist-resp">${escHtml(item.response)}</div>
        <div class="hist-time">${item.ts}</div>
      </div>`;
    historyList.appendChild(el);
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Poll status ─────────────────────────────────────────────── */
async function pollStatus() {
  try {
    const res = await fetch('/api/status');
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();

    if (!connected) {
      connected = true;
      connDot.classList.add('online');
    }

    if (data.phase !== lastPhase || data.message !== lastMsg) {
      applyPhase(data.phase, data.message);
    }

  } catch {
    if (connected) {
      connected = false;
      connDot.classList.remove('online');
      applyPhase('error', 'Cannot reach AC server — is main.py running?');
    }
  }
}

/* ── Poll history ────────────────────────────────────────────── */
async function pollHistory() {
  try {
    const res = await fetch('/api/history');
    if (!res.ok) return;
    const data = await res.json();
    if (data.length !== lastHistLen) {
      lastHistLen = data.length;
      renderHistory(data);
    }
  } catch { /* silent */ }
}

/* ── Diary Manual Logic ──────────────────────────────────────── */
let currentDiaryTab = 'write';
let diaryEntries = [];
let selectedDiaryIndex = -1;

function switchDiaryTab(tab) {
  currentDiaryTab = tab;
  document.getElementById('btnWriteTab').classList.toggle('active', tab === 'write');
  document.getElementById('btnOverwriteTab').classList.toggle('active', tab === 'overwrite');
  document.getElementById('btnDeleteTab').classList.toggle('active', tab === 'delete');

  document.getElementById('secWrite').classList.toggle('active', tab === 'write');
  document.getElementById('secOverwrite').classList.toggle('active', tab === 'overwrite');
  document.getElementById('secDelete').classList.toggle('active', tab === 'delete');

  if (tab === 'overwrite' || tab === 'delete') {
    fetchDiaryEntries();
  }
}

async function fetchDiaryEntries() {
  try {
    const res = await fetch('/api/diary');
    if (!res.ok) throw new Error();
    diaryEntries = await res.json();
    renderDiaryLists();
  } catch (e) {
    showToast('Failed to load diary entries.', 'error');
  }
}

function renderDiaryLists() {
  const lstOverwrite = document.getElementById('lstOverwrite');
  const lstDelete = document.getElementById('lstDelete');

  if (diaryEntries.length === 0) {
    const emptyHtml = `<div class="empty-state">No diary entries found. Write one first!</div>`;
    lstOverwrite.innerHTML = emptyHtml;
    lstDelete.innerHTML = emptyHtml;
    document.getElementById('editArea').style.display = 'none';
    return;
  }

  // Render Overwrite list
  lstOverwrite.innerHTML = diaryEntries.map(entry => `
    <div class="diary-item ${selectedDiaryIndex === entry.index ? 'selected' : ''}" onclick="selectDiaryEntry(${entry.index})">
      <div style="flex:1;">
        <div class="diary-meta">${entry.timestamp}</div>
        <div class="diary-snippet">${escHtml(entry.text)}</div>
      </div>
    </div>
  `).join('');

  // Render Delete list
  lstDelete.innerHTML = diaryEntries.map(entry => `
    <div class="diary-item">
      <div style="flex:1;">
        <div class="diary-meta">${entry.timestamp}</div>
        <div class="diary-snippet">${escHtml(entry.text)}</div>
      </div>
      <button class="btn-delete-item" onclick="deleteDiaryEntry(${entry.index}, event)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  `).join('');
}

function selectDiaryEntry(index) {
  selectedDiaryIndex = index;
  const entry = diaryEntries.find(e => e.index === index);
  if (entry) {
    document.getElementById('txtOverwrite').value = entry.text;
    document.getElementById('editArea').style.display = 'flex';
    renderDiaryLists();
  }
}

async function submitDiaryWrite() {
  const text = document.getElementById('txtWrite').value.trim();
  if (!text) {
    showToast('Please type some content first.', 'error');
    return;
  }
  try {
    const res = await fetch('/api/diary/write', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Diary entry saved successfully!', 'success');
      document.getElementById('txtWrite').value = '';
    } else {
      showToast('Failed to save entry.', 'error');
    }
  } catch (e) {
    showToast('Network error while saving.', 'error');
  }
}

async function submitDiaryOverwrite() {
  const text = document.getElementById('txtOverwrite').value.trim();
  if (selectedDiaryIndex === -1) return;
  try {
    const res = await fetch('/api/diary/overwrite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: selectedDiaryIndex, text })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Diary entry updated successfully!', 'success');
      document.getElementById('editArea').style.display = 'none';
      selectedDiaryIndex = -1;
      fetchDiaryEntries();
    } else {
      showToast('Failed to update entry.', 'error');
    }
  } catch (e) {
    showToast('Network error while updating.', 'error');
  }
}

async function deleteDiaryEntry(index, event) {
  event.stopPropagation();
  if (!confirm('Are you sure you want to delete this diary entry?')) return;
  try {
    const res = await fetch('/api/diary/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index })
    });
    const data = await res.json();
    if (data.success) {
      showToast('Diary entry deleted successfully!', 'success');
      if (selectedDiaryIndex === index) {
        document.getElementById('editArea').style.display = 'none';
        selectedDiaryIndex = -1;
      }
      fetchDiaryEntries();
    } else {
      showToast('Failed to delete entry.', 'error');
    }
  } catch (e) {
    showToast('Network error while deleting.', 'error');
  }
}

async function closeDiaryModal() {
  document.getElementById('diaryModal').classList.remove('active');
  try {
    await fetch('/api/status/reset', { method: 'POST' });
  } catch (e) {}
}

function showToast(msg, type) {
  const toast = document.getElementById('modalToast');
  toast.textContent = msg;
  toast.style.display = 'block';
  toast.style.background = type === 'success' ? 'rgba(74, 222, 128, 0.15)' : 'rgba(248, 113, 113, 0.15)';
  toast.style.color = type === 'success' ? 'var(--green)' : 'var(--red)';
  toast.style.border = `1px solid ${type === 'success' ? 'var(--green)' : 'var(--red)'}`;
  setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

/* ── Boot ────────────────────────────────────────────────────── */
(async function boot() {
  // initial paint
  applyPhase('idle', 'Waiting for AC to start…');

  setInterval(pollStatus,  POLL_MS);
  setInterval(pollHistory, POLL_MS * 2);

  pollStatus();
  pollHistory();
})();
</script>
</body>
</html>
